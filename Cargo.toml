[package]
name = "antidote"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
crossbeam = "0.8.5"
cxx = "1.0.202"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.8.0"
embedded-graphics = "0.8.2"
embedded-hal-compat = "0.13.0"
linux-embedded-hal = { version = "0.5.0", default-features = false, features = ["i2c", "spi"] }
sh1106 = "0.5.0"

[build-dependencies]
cxx-build = "1.0.202"
glob = "0.3.4"
